[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jady-call"
version = "0.1.0"
description = "Official Python implementation of jady.call, a standardized HTTP client interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jaytheminer", email = "jaytheminer7@gmail.com" }
]
dependencies = []
keywords = ["http", "client", "request", "jady", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/jaytheminer/jady_call#readme"
Repository = "https://github.com/jaytheminer/jady_call.git"
Documentation = "https://github.com/jaytheminer/jady_call/tree/main/specs"
Issues = "https://github.com/jaytheminer/jady_call/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "twine>=5.1.1"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
